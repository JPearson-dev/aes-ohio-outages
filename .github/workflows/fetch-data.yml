name: Fetch Outage Data

on:
  # schedule: # This is now handled by an external cron job that is more consistent
  #   - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [invoke-fetch]

permissions:
  contents: write

# Overlapping runs race to push the data branch ("cannot lock ref ... expected
# ..."). Queue them instead; the queued run checks out data after the first
# one has pushed.
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch-and-commit:
    # ubuntu-slim is a container with 15min limit. It's enough for us.
    #   Hopefully using it reduces the already-rare issues obtaining a Runner
    # ubuntu-latest is a full vm and has a 6hr limit.
    runs-on: ubuntu-slim
    steps:
      - name: Checkout main branch (code)
        uses: actions/checkout@v7
        with:
          ref: 'main'
          path: 'code'

      - name: Checkout data branch (data)
        uses: actions/checkout@v7
        with:
          ref: 'data'
          path: 'data'

      # Exit 75 means the feed returned 404 on several consecutive attempts:
      # an upstream outage, not our bug. Record it instead of failing the run.
      - name: Fetch and process outage data
        id: fetch
        run: |
          rc=0
          python3 code/ingest/scripts/fetch/fetch.py --out-dir data \
            --skip-note "$RUNNER_TEMP/skip-note.txt" || rc=$?
          if [ "$rc" -eq 75 ]; then
            echo "::warning::AES Ohio feed returned repeated 404s; recording a skipped snapshot"
            echo "unavailable=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: Commit and push changes
        id: commit
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.fetch.outputs.unavailable }}" = "true" ]; then
            # Message-only commit so the gap is visible in the data history.
            # changed stays false: no files changed, so nothing to purge.
            git commit --allow-empty -F "$RUNNER_TEMP/skip-note.txt"
            changed=false
          else
            git add -A current/ heartbeat.csv README.md
            if git diff --cached --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            changed=true
          fi
          # GitHub occasionally fails a push server-side ("remote: fatal error
          # in commit_refs"). Retry; if the ref did update anyway, the retry
          # is a harmless "Everything up-to-date".
          for attempt in 1 2 3; do
            git push origin data && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "::warning::Push attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # jsDelivr caches the @data branch ref for hours; without this, the site
      # (which reads current/*.json and heartbeat.csv via jsDelivr) can lag
      # well behind what's actually on the data branch. No auth needed -
      # purge.jsdelivr.net is a public, unauthenticated endpoint.
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in current/latest.xml current/incidents.json current/counties.json current/status.json heartbeat.csv; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/$f" \
              || echo "::warning::jsDelivr purge failed for $f"
          done
