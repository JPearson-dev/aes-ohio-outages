name: Fetch Outage Data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch (code)
        uses: actions/checkout@v4
        with:
          ref: 'main'
          path: 'code'

      - name: Checkout data branch (data)
        uses: actions/checkout@v4
        with:
          ref: 'data'
          path: 'data'

      - name: Fetch and process outage data
        run: python code/scripts/fetch.py --out-dir data

      - name: Commit and push changes
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A current/ heartbeat.csv README.md
          git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')" || exit 0
          git push origin data
